<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=0.5">
<title>Programas · Tierra Linda</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500&family=Lora:ital@1&display=swap" rel="stylesheet">
<style>
  @page { size: letter landscape; margin: 0; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --verde: #17452e; --verde2: #1e5a3c; --oro: #b8912f; --tinta: #22312a;
    --gris: #66756c; --linea: #dde6df; --suave: #f3f7f4;
  }
  body { background: #e9ece9; font-family: 'Poppins', 'Segoe UI', sans-serif; }

  /* ---------- Barra de herramientas (no se imprime) ---------- */
  .toolbar {
    position: sticky; top: 0; z-index: 50; display: flex; gap: 8px; flex-wrap: wrap;
    align-items: center; justify-content: center; padding: 10px 16px;
    background: var(--verde); box-shadow: 0 2px 10px rgba(0,0,0,.25);
  }
  .toolbar button {
    font-family: 'Poppins', sans-serif; font-size: 12.5px; font-weight: 500;
    border: none; border-radius: 8px; padding: 8px 14px; cursor: pointer;
    background: #fff; color: var(--verde);
  }
  .toolbar button.primario { background: var(--oro); color: #fff; }
  .toolbar button:hover { filter: brightness(1.06); }
  .toolbar .aviso { font-size: 11px; color: #cfe0d5; width: 100%; text-align: center; }
  #estado { font-size: 11px; color: #ffe9b8; min-width: 130px; text-align: center; }

  /* ---------- Hoja carta horizontal ---------- */
  .hoja {
    width: 11in; min-height: 8.5in; margin: 18px auto; background: #fff;
    box-shadow: 0 6px 30px rgba(0,0,0,.18);
    padding: 0.3in 0.45in 0.25in; display: flex; flex-direction: column;
    color: var(--tinta); font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
  }
  [contenteditable]:hover { outline: 1.5px dashed #b8d4c2; outline-offset: 1px; }
  [contenteditable]:focus { outline: 2px solid var(--oro); outline-offset: 1px; background: #fffbef; }

  header { display: flex; align-items: center; gap: 20px; }
  header img { cursor: pointer; }
  header img.tl { width: 150px; }
  header img.sda { width: 64px; }
  header img:hover { outline: 1.5px dashed var(--oro); outline-offset: 3px; }
  .titulo { flex: 1; text-align: center; }
  .kicker { font-family: 'Poppins'; font-weight: 500; font-size: 8.5px; letter-spacing: 3.2px; color: var(--oro); text-transform: uppercase; margin-bottom: 3px; }
  h1 { font-family: 'Poppins'; font-weight: 500; font-size: 19px; color: var(--verde); letter-spacing: 0.4px; }
  .fecha { font-family: 'Poppins'; font-weight: 300; font-size: 12.5px; margin-top: 1px; }
  .meta { display: flex; justify-content: center; align-items: center; gap: 8px; margin: 7px 0; flex-wrap: wrap; }
  .meta span.mchip { position: relative; font-size: 9.6px; color: var(--verde); background: var(--suave); border: 0.75px solid var(--linea); border-radius: 999px; padding: 3px 11px; }
  .meta span.mchip b { color: var(--tinta); }
  .meta .quitar { position: absolute; top: -7px; right: -7px; width: 15px; height: 15px; line-height: 13px; font-size: 9px; border-radius: 50%; border: 1px solid var(--linea); background: #fff; color: var(--gris); cursor: pointer; display: none; }
  .meta span.mchip:hover .quitar { display: block; }
  .meta .agregar { font-size: 10px; border: 1px dashed var(--linea); background: #fff; color: var(--gris); border-radius: 999px; padding: 3px 9px; cursor: pointer; }
  .regla { height: 2px; background: linear-gradient(90deg, transparent, var(--oro) 18%, var(--oro) 82%, transparent); margin-bottom: 7px; }

  table { width: 100%; border-collapse: collapse; flex: 1; }
  td { vertical-align: middle; padding: 3px 10px; border-bottom: 0.75px solid var(--linea); }
  tr.sec-first td { border-top: 2px solid var(--verde); }
  tbody tr:last-child td { border-bottom: 2px solid var(--verde); }
  .spine { width: 30px; background: var(--verde); border-bottom: 2px solid #fff; padding: 4px 2px; }
  .spine span { writing-mode: vertical-rl; transform: rotate(180deg); display: block; margin: 0 auto; font-family: 'Poppins'; font-weight: 500; font-size: 9px; letter-spacing: 2.4px; color: #fff; white-space: nowrap; }
  .hora { width: 108px; white-space: nowrap; }
  .rango { font-family: 'Poppins'; font-weight: 500; font-size: 11px; color: var(--verde2); }
  .mins { font-size: 8.8px; color: var(--gris); letter-spacing: 0.5px; }
  .espacio .tit { font-size: 12.2px; font-weight: 700; }
  .espacio .sub { font-size: 10.2px; color: var(--gris); margin-top: 1px; }
  .espacio .sub:empty::before, .dirige .rol:empty::before { content: 'detalle (opcional)'; color: #c3cfc7; }
  .dirige { width: 258px; text-align: right; }
  .dirige .nom { font-size: 11.6px; font-weight: 700; color: var(--verde); }
  .dirige .rol { font-size: 9.3px; color: var(--gris); margin-top: 1px; }
  .chip { display: inline-block; font-family: 'Poppins'; font-weight: 500; font-size: 7.6px; letter-spacing: 1.1px; text-transform: uppercase; color: var(--oro); border: 0.9px solid var(--oro); border-radius: 999px; padding: 1.5px 8px; margin-top: 2.5px; }

  /* columna de acciones por fila (no se imprime) */
  .ops { width: 60px; border-bottom: none !important; border-top: none !important; white-space: nowrap; }
  .ops button { border: 1px solid var(--linea); background: #fff; color: var(--gris); border-radius: 6px; width: 22px; height: 22px; cursor: pointer; font-size: 12px; margin-left: 3px; }
  .ops button:hover { color: var(--verde); border-color: var(--verde2); }

  footer.pie { display: flex; gap: 14px; margin-top: 8px; align-items: stretch; }
  .recos { flex: 1.5; background: var(--suave); border: 0.75px solid var(--linea); border-radius: 8px; padding: 8px 12px; font-size: 9.4px; line-height: 1.45; }
  .recos h2 { font-family: 'Poppins'; font-weight: 500; font-size: 8.5px; letter-spacing: 2px; text-transform: uppercase; color: var(--verde); margin-bottom: 3px; }
  .recos b { color: var(--verde2); }
  .cita { flex: 1; border-left: 3px solid var(--oro); padding: 6px 2px 6px 14px; display: flex; flex-direction: column; justify-content: center; }
  .cita p { font-family: 'Lora', Georgia, serif; font-style: italic; font-size: 10.3px; line-height: 1.42; color: var(--verde); }
  .cita .autor { font-family: 'Poppins'; font-size: 8.2px; font-style: normal; color: var(--gris); margin-top: 4px; letter-spacing: 0.6px; }

  @media print {
    body { background: #fff; }
    .toolbar, .ops, .meta .quitar, .meta .agregar { display: none !important; }
    .hoja { margin: 0; box-shadow: none; width: 11in; height: 8.5in; }
    header img:hover { outline: none; }
    [contenteditable]:hover, [contenteditable]:focus { outline: none; background: transparent; }
    .espacio .sub:empty::before, .dirige .rol:empty::before { content: ''; }
  }
</style></head>
<body>

<div class="toolbar">
  <button class="primario" onclick="window.print()">🖨️ Imprimir / Guardar PDF</button>
  <button onclick="agregarSeccion()">➕ Sección</button>
  <button onclick="copiarEnlace()">🔗 Copiar enlace con mi versión</button>
  <button onclick="descargarHTML()">💾 Descargar copia</button>
  <button onclick="restablecer()">↺ Restablecer ejemplo</button>
  <span id="estado"></span>
  <span class="aviso">Todo es editable con un clic: títulos, etiquetas, secciones, horas y responsables. En cada fila: ➕ agrega un espacio, 👤 pone o quita el sello, ✕ lo elimina. Clic en un logo para reemplazarlo. Los cambios se guardan solos en este navegador.</span>
</div>

in", "tit": "Diezmos y ofrendas", "sub": "Himno #282 · Brilla Jesús", "nom": "Andrés Torres", "rol": "", "chip": true, "chipText": "Anciano de turno"}, {"hora": "11:15 – 11:30", "mins": "15 min", "tit": "Momento de alabanza · niños", "sub": "Fe en fuego + El cielo te espera · Ora sin cesar · Shabat Rest", "nom": "Dirige: Angie Ayala", "rol": "Cantan: Josué, Daniel, Alaia, Ana Lucía, Camila, Charlott", "chip": false, "chipText": ""}]}, {"nombre": "CULTO DIVINO", "filas": [{"hora": "11:30 – 11:35", "mins": "5 min", "tit": "Doxología · Sea Exaltado", "sub": "", "nom": "Angie Ayala", "rol": "", "chip": false, "chipText": ""}, {"hora": "11:35 – 12:20", "mins": "45 min", "tit": "Predicación", "sub": "", "nom": "Silvia Lozano", "rol": "Dir. Ministerio de la Mujer · Asociación del Alto Magdalena", "chip": false, "chipText": ""}, {"hora": "12:20 – 12:25", "mins": "5 min", "tit": "Oración final y despedida", "sub": "", "nom": "Andrés Torres", "rol": "", "chip": true, "chipText": "Anciano de turno"}]}], "recosTitulo": "Recomendaciones", "recos": "<b>1.</b> Ajustémonos al horario establecido y cumplámoslo con amor; por ningún motivo habrá cambios que no estén planeados con anticipación. <b>2.</b> Quienes suben a plataforma: vestuario formal, no joyas, no tennis. <b>3.</b> A los responsables de cada ministerio, recomendar el buen uso del tiempo asignado. <b>4.</b> Anuncios: a Comunicaciones (Joana Salazar) hasta el viernes 4:00 pm, imágenes en 16:9. <b>5.</b> En la tarde: Feria de Talento Infantil, a cargo del Ministerio Infantil. Que todo lo que hagamos sea para la honra y gloria de nuestro Dios.", "cita": "“Dios es un Dios de orden. Todo lo que se relaciona con el cielo está en perfecto orden; la sujeción y perfecta disciplina distinguen los movimientos de la hueste angélica. El éxito solo puede acompañar al orden y a la acción armoniosa.”", "autor": "Elena G. de White · Patriarcas y Profetas, p. 391"};
const CLAVE = 'programa-editable-v1';
let modelo = null;
const $ = s => document.querySelector(s);

/* ---------- estado: URL (#) > localStorage > ejemplo ---------- */
function cargar() {
  if (location.hash.length > 1) {
    try { return normalizar(JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(location.hash.slice(1))))))); }
    catch (e) { console.warn('enlace inválido', e); }
  }
  try { const g = localStorage.getItem(CLAVE); if (g) return normalizar(JSON.parse(g)); } catch (e) {}
  return JSON.parse(JSON.stringify(ORIGINAL));
}
function normalizar(m) {
  // completa campos que falten en versiones viejas del estado
  const base = JSON.parse(JSON.stringify(ORIGINAL));
  return Object.assign(base, m);
}
let tGuardar = null;
function guardar() {
  clearTimeout(tGuardar);
  tGuardar = setTimeout(() => {
    leerDOM();
    try { localStorage.setItem(CLAVE, JSON.stringify(modelo)); marcarEstado('Guardado ✓'); }
    catch (e) { marcarEstado('No se pudo guardar aquí'); }
  }, 400);
}
function marcarEstado(txt) { $('#estado').textContent = txt; setTimeout(() => $('#estado').textContent = '', 2500); }

/* ---------- render ---------- */
function render() {
  document.querySelectorAll('[data-k]').forEach(el => {
    const k = el.dataset.k;
    if (k === 'recos') el.innerHTML = modelo[k]; else el.textContent = modelo[k];
  });
  if (modelo.logos) {
    if (modelo.logos.tl) $('#logo-tl').src = modelo.logos.tl;
    if (modelo.logos.sda) $('#logo-sda').src = modelo.logos.sda;
  }
  $('#meta').innerHTML = modelo.meta.map((m, i) =>
    `<span class="mchip"><i style="font-style:normal" contenteditable data-metal="${i}">${m[0]}</i> <b contenteditable data-meta="${i}">${m[1]}</b><button class="quitar" title="Quitar etiqueta" onclick="quitarMeta(${i})">✕</button></span>`
  ).join('') + `<button class="agregar" onclick="agregarMeta()">➕ etiqueta</button>`;

  const tb = $('#cuerpo'); tb.innerHTML = '';
  modelo.secciones.forEach((sec, si) => {
    sec.filas.forEach((f, fi) => {
      const tr = document.createElement('tr');
      if (fi === 0) {
        tr.className = 'sec-first';
        tr.innerHTML = `<td class="spine" rowspan="${sec.filas.length}"><span contenteditable data-sec="${si}">${sec.nombre}</span></td>`;
      }
      tr.innerHTML += `
        <td class="hora"><div class="rango" contenteditable data-f="${si}.${fi}.hora">${f.hora}</div>
          <div class="mins" contenteditable data-f="${si}.${fi}.mins">${f.mins}</div></td>
        <td class="espacio"><div class="tit" contenteditable data-f="${si}.${fi}.tit">${f.tit}</div>
          <div class="sub" contenteditable data-f="${si}.${fi}.sub">${f.sub}</div></td>
        <td class="dirige"><div class="nom" contenteditable data-f="${si}.${fi}.nom">${f.nom}</div>
          ${f.chip ? `<span class="chip" contenteditable data-f="${si}.${fi}.chipText">${f.chipText || 'Anciano de turno'}</span>`
                   : `<div class="rol" contenteditable data-f="${si}.${fi}.rol">${f.rol}</div>`}</td>
        <td class="ops">
          <button title="Agregar espacio debajo" onclick="agregarFila(${si},${fi})">➕</button>
          <button title="Sello (ej. anciano de turno)" onclick="alternarChip(${si},${fi})">👤</button>
          <button title="Quitar este espacio" onclick="quitarFila(${si},${fi})">✕</button>
        </td>`;
      tb.appendChild(tr);
    });
  });
}

/* ---------- lectura del DOM al modelo ---------- */
function leerDOM() {
  document.querySelectorAll('[data-k]').forEach(el => {
    const k = el.dataset.k;
    modelo[k] = (k === 'recos') ? el.innerHTML : el.textContent.trim();
  });
  document.querySelectorAll('[data-metal]').forEach(el => modelo.meta[+el.dataset.metal][0] = el.textContent.trim());
  document.querySelectorAll('[data-meta]').forEach(el => modelo.meta[+el.dataset.meta][1] = el.textContent.trim());
  document.querySelectorAll('[data-sec]').forEach(el => modelo.secciones[+el.dataset.sec].nombre = el.textContent.trim());
  document.querySelectorAll('[data-f]').forEach(el => {
    const [si, fi, campo] = el.dataset.f.split('.');
    modelo.secciones[+si].filas[+fi][campo] = el.textContent.trim();
  });
}

/* ---------- operaciones ---------- */
const FILA_NUEVA = () => ({ hora: '00:00 – 00:00', mins: '5 min', tit: 'Nuevo espacio', sub: '', nom: 'Responsable', rol: '', chip: false, chipText: '' });
function agregarFila(si, fi) { leerDOM(); modelo.secciones[si].filas.splice(fi + 1, 0, FILA_NUEVA()); render(); guardar(); }
function quitarFila(si, fi) {
  leerDOM();
  const sec = modelo.secciones[si];
  if (sec.filas.length === 1) { if (!confirm('Esto elimina la sección completa. ¿Continuar?')) return; modelo.secciones.splice(si, 1); }
  else sec.filas.splice(fi, 1);
  render(); guardar();
}
function alternarChip(si, fi) {
  leerDOM();
  const f = modelo.secciones[si].filas[fi];
  f.chip = !f.chip;
  if (f.chip) { f.chipText = f.chipText || 'Anciano de turno'; f.rol = ''; }
  render(); guardar();
}
function agregarSeccion() { leerDOM(); modelo.secciones.push({ nombre: 'NUEVA SECCIÓN', filas: [FILA_NUEVA()] }); render(); guardar(); }
function agregarMeta() { leerDOM(); modelo.meta.push(['Etiqueta:', 'Valor']); render(); guardar(); }
function quitarMeta(i) { leerDOM(); modelo.meta.splice(i, 1); render(); guardar(); }

/* ---------- logos reemplazables ---------- */
let logoDestino = null;
$('#logo-tl').onclick = () => pedirLogo('tl');
$('#logo-sda').onclick = () => pedirLogo('sda');
function pedirLogo(cual) { logoDestino = cual; $('#selector-logo').click(); }
$('#selector-logo').onchange = e => {
  const archivo = e.target.files[0]; if (!archivo) return;
  const lector = new FileReader();
  lector.onload = () => {
    modelo.logos = modelo.logos || {};
    modelo.logos[logoDestino] = lector.result;
    render(); guardar();
  };
  lector.readAsDataURL(archivo);
  e.target.value = '';
};

/* ---------- compartir y utilidades ---------- */
function copiarEnlace() {
  leerDOM();
  const copia = JSON.parse(JSON.stringify(modelo));
  delete copia.logos; // los logos personalizados harian el enlace demasiado largo
  const hash = encodeURIComponent(btoa(unescape(encodeURIComponent(JSON.stringify(copia)))));
  const url = location.origin + location.pathname + '#' + hash;
  navigator.clipboard.writeText(url)
    .then(() => marcarEstado('Enlace copiado ✓'))
    .catch(() => prompt('Copia el enlace:', url));
}
function descargarHTML() {
  leerDOM();
  const doc = document.documentElement.cloneNode(true);
  doc.querySelectorAll('script').forEach(s => s.remove());
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['<!DOCTYPE html>' + doc.outerHTML], { type: 'text/html' }));
  a.download = 'programa.html';
  a.click();
}
